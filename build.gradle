import groovy.xml.*

plugins {
    id 'java'
    id 'war'
}

version = "1.1.2"

configurations {
    jspc
    jakartaMigration
    legacyJavax
    compileOnlyResolvable {
        canBeResolved = true
        canBeConsumed = false
        extendsFrom compileOnly
    }
}

repositories {
    mavenCentral()
    maven {
        url = "https://bbprepo.blackboard.com/repository/releases/"
    }
}


java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// javax.* jars are staged, rewritten to jakarta.*, then the patched Stripes jar is
// swapped in. jakartaLibsDir is what ends up in WEB-INF/lib.
def legacyJavaxLibsDir = layout.buildDirectory.dir('legacy-javax-libs')
def migratedLibsDir = layout.buildDirectory.dir('jakarta-libs-raw')
def jakartaLibsDir = layout.buildDirectory.dir('jakarta-libs')

def migratedLibs = fileTree(migratedLibsDir) {
    include '*.jar'
    builtBy 'migrateToJakarta'
}

sourceSets {
    // Stripes classes that have to be recompiled rather than rewritten.
    stripesPatch {
        java.srcDirs = ['src/stripes-patch/java']
        resources.srcDirs = []
    }
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << '-Xlint:deprecation'
    options.encoding = 'UTF-8'
}

dependencies {
    implementation 'org.slf4j:slf4j-api:2.0.17'
    implementation 'org.slf4j:jul-to-slf4j:2.0.17'
    implementation 'ch.qos.logback:logback-classic:1.5.19'
    implementation 'org.slf4j:log4j-over-slf4j:2.0.17'

    // javax.servlet based, so rewritten by migrateToJakarta and bundled from
    // build/jakarta-libs. commons-fileupload used to come from Blackboard, but Stripes
    // needs the javax-era 1.x API that Bb can no longer supply.
    legacyJavax('net.sourceforge.stripes:stripes:1.6.0') { transitive = false }
    legacyJavax('commons-fileupload:commons-fileupload:1.5') { transitive = false }
    legacyJavax files('lib/bb-stripes-utils-1.1.2.jar')
    // Was a transitive of Stripes. Migrated too, so verifyJakartaOnly stays meaningful.
    legacyJavax('commons-logging:commons-logging:1.1.3') { transitive = false }

    jakartaMigration 'org.apache.tomcat:jakartaee-migration:1.0.9'

    implementation fileTree(jakartaLibsDir) {
        include '*.jar'
        builtBy 'assembleJakartaLibs'
    }

    implementation files('lib/b2-logging-utils-1.0.0.jar')

    implementation('org.apache.commons:commons-jexl:2.1.1') {
        // commons-logging is bundled from build/jakarta-libs instead.
        exclude group: 'commons-logging', module: 'commons-logging'
    }
    implementation 'com.thoughtworks.xstream:xstream:1.4.21'
    implementation 'com.google.code.gson:gson:2.13.2'

    compileOnly 'org.apache.velocity:velocity-engine-core:2.3'
    compileOnly 'commons-io:commons-io:2.19.0'
    compileOnly 'jakarta.servlet:jakarta.servlet-api:6.1.0'

    compileOnly 'blackboard.platform:bb-platform:4001.0.0'
    compileOnly 'blackboard.platform:bb-taglibs:4001.0.0'

    // Do not bump without testing on Blackboard: precompiled JSPs bind to the Jasper
    // runtime Bb ships. 11.0.25 emits a JspRuntimeLibrary.releaseTag overload that Bb's
    // Tomcat does not have, which is a NoSuchMethodError when a page renders.
    jspc 'org.apache.tomcat:tomcat-jasper:11.0.22'
    jspc 'org.apache.tomcat:tomcat-jasper-el:11.0.22'
    jspc 'org.eclipse.jdt:ecj:3.46.0'
    // JSTL 3.0 (jakarta.tags.* URIs), build-time only. Do not bundle it: Bb's
    // LocalizationContext comes from its own class loader and would not be castable.
    jspc 'org.glassfish.web:jakarta.servlet.jsp.jstl:3.0.1'
    jspc('jakarta.servlet.jsp.jstl:jakarta.servlet.jsp.jstl-api:3.0.0') { transitive = false }
    jspc "org.apache.ant:ant:1.10.14"
    jspc "org.apache.ant:ant-launcher:1.10.14"
    jspc 'org.slf4j:slf4j-simple:2.0.17'
}

tasks.register('collectLegacyJavaxJars', Sync) {
    group = 'build'
    description = 'Stage the javax.* dependencies that need rewriting to jakarta.*'
    from configurations.legacyJavax
    into legacyJavaxLibsDir
}

tasks.register('migrateToJakarta', JavaExec) {
    group = 'build'
    description = 'Rewrite the staged javax.* jars to jakarta.* using the Tomcat Jakarta EE migration tool'
    dependsOn tasks.named('collectLegacyJavaxJars')

    inputs.dir(legacyJavaxLibsDir)
    outputs.dir(migratedLibsDir)

    classpath = configurations.jakartaMigration
    mainClass.set('org.apache.tomcat.jakartaee.MigrationCLI')

    def sourceDir = legacyJavaxLibsDir.get().asFile
    def targetDir = migratedLibsDir.get().asFile

    args = ['-profile=EE', sourceDir.absolutePath, targetDir.absolutePath]

    // The tool will not overwrite an existing jar, so start from an empty directory.
    doFirst {
        targetDir.deleteDir()
        targetDir.mkdirs()
    }
}

sourceSets.stripesPatch.compileClasspath =
        migratedLibs + configurations.jspc + configurations.compileOnlyResolvable

// Anything the patch source set rebuilds must come out of the migrated jar first,
// inner classes included, or the jar gets two copies.
def stripesPatchSrcDir = file('src/stripes-patch/java')
def patchedClassPatterns = fileTree(stripesPatchSrcDir)
        .matching { include '**/*.java' }
        .files
        .collect { stripesPatchSrcDir.toPath().relativize(it.toPath()).toString().replace(File.separator, '/') }
        .collect { it.replaceFirst(/\.java$/, '') }
        .collectMany { [it + '.class', it + '\$*.class'] }

tasks.register('patchStripesJar', Jar) {
    group = 'build'
    description = 'Swap the recompiled Stripes classes into the migrated Stripes jar'
    dependsOn tasks.named('migrateToJakarta'), tasks.named('stripesPatchClasses')

    archiveFileName = 'stripes-1.6.0.jar'
    destinationDirectory = layout.buildDirectory.dir('stripes-patched')

    duplicatesStrategy = DuplicatesStrategy.FAIL

    from(zipTree(migratedLibsDir.get().asFile.toPath().resolve('stripes-1.6.0.jar').toFile())) {
        exclude patchedClassPatterns
        exclude 'META-INF/MANIFEST.MF'
    }
    from sourceSets.stripesPatch.output

    manifest {
        attributes(
                'Specification-Title': 'Stripes',
                'Specification-Version': '1.6.0',
                'Specification-Vendor': 'Stripes Framework',
                'Implementation-Title': 'Stripes',
                'Implementation-Version': '1.6.0-jakarta-patched',
                'Implementation-Vendor': 'Stripes Framework',
                'Implementation-Vendor-Id': 'net.sourceforge.stripes'
        )
    }
}

tasks.register('assembleJakartaLibs', Sync) {
    group = 'build'
    description = 'Collect the jakarta.* libraries that get bundled into WEB-INF/lib'
    from(migratedLibs) { exclude 'stripes-1.6.0.jar' }
    from tasks.named('patchStripesJar')
    into jakartaLibsDir
}

def webAppDir = file('src/main/webapp')
def jspSrcDir = file('src/main/webapp/WEB-INF/jsp')
def jspGenDir = layout.buildDirectory.dir('generated-jsp')

def mainWebXml = file('src/main/webapp/WEB-INF/web.xml')
def webXmlFragment= layout.buildDirectory.file("web-fragment.xml")
def mergedWebXml = layout.buildDirectory.file("merged-web.xml")

tasks.register('jspcGenerate', JavaExec) {
    group = 'build'
    description = 'Compile JSPs at build time via Jasper JSPC'
    inputs.dir(webAppDir)
    inputs.dir(jspSrcDir)
    outputs.dir(jspGenDir)
    outputs.file(webXmlFragment)

    classpath = files(
            configurations.jspc,
            sourceSets.main.output,
            sourceSets.main.compileClasspath,
            configurations.compileOnlyResolvable
    ).filter { f ->
        def n = f.name
        !n.startsWith('logback-') && !n.contains('logback-classic') && !n.contains('logback-core')
    }

    mainClass.set('org.apache.jasper.JspC')

    // Jasper stamps generated .java files with their .jsp's mtime and then thinks they
    // are up to date, so it silently reuses output from other Jasper versions.
    def jspGenDirFile = jspGenDir.get().asFile
    doFirst {
        jspGenDirFile.deleteDir()
        jspGenDirFile.mkdirs()
    }

    args = [
            '-uriroot', webAppDir.absolutePath,
            '-webapp',  webAppDir.absolutePath,
            '-p',       'org.oscelot.jshack.jsp',
            '-d',       jspGenDir.get().asFile.absolutePath,
            '-webxml', webXmlFragment.get().asFile.absolutePath,
            '-compile',
    ]
}

tasks.named('war') {
    dependsOn tasks.named('jspcGenerate')
    dependsOn tasks.named('mergeWebXml')

    from(jspGenDir) {
        into 'WEB-INF/classes'
        exclude '**/*.java'
    }
    webXml = mergedWebXml.get().asFile

    exclude('WEB-INF/web.xml')
}

tasks.register('verifyJakartaOnly') {
    group = 'verification'
    description = 'Fail the build if anything in the WAR still references javax.servlet'

    def warFile = tasks.named('war', War).flatMap { it.archiveFile }
    def report = layout.buildDirectory.file('reports/jakarta-only.txt')
    inputs.file(warFile)
    outputs.file(report)

    doLast {
        byte[] needle = 'javax/servlet'.bytes

        def containsNeedle = { byte[] data ->
            int limit = data.length - needle.length
            for (int i = 0; i <= limit; i++) {
                int j = 0
                while (j < needle.length && data[i + j] == needle[j]) {
                    j++
                }
                if (j == needle.length) {
                    return true
                }
            }
            return false
        }

        def offenders = []
        def scan
        scan = { java.util.zip.ZipInputStream zin, String prefix ->
            def entry
            while ((entry = zin.nextEntry) != null) {
                def out = new ByteArrayOutputStream()
                zin.transferTo(out)
                byte[] bytes = out.toByteArray()
                def path = prefix + entry.name
                if (entry.name.endsWith('.jar') || entry.name.endsWith('.war')) {
                    new ByteArrayInputStream(bytes).withStream { nested ->
                        scan(new java.util.zip.ZipInputStream(nested), path + '!/')
                    }
                } else if (entry.name.endsWith('.class') && containsNeedle(bytes)) {
                    offenders << path
                }
            }
        }

        warFile.get().asFile.withInputStream { input ->
            scan(new java.util.zip.ZipInputStream(input), '')
        }

        def reportFile = report.get().asFile
        reportFile.parentFile.mkdirs()
        reportFile.text = offenders.isEmpty() ? 'No javax.servlet references.\n' : offenders.join('\n') + '\n'

        if (!offenders.isEmpty()) {
            throw new GradleException(
                    "The WAR still references javax.servlet, which does not exist on Blackboard's Tomcat 11:\n  " +
                            offenders.join('\n  '))
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyJakartaOnly')
}

tasks.register('mergeWebXml') {
    group = 'build'
    description = 'Merge JSPC-generated servlet entries into web.xml'
    dependsOn tasks.named('jspcGenerate')

    inputs.files(mainWebXml, webXmlFragment)
    outputs.file(mergedWebXml)

    doLast {
        def webXmlFragmentFile = webXmlFragment.get().asFile;
        def mergedWebXmlFile = mergedWebXml.get().asFile;

        if (!mainWebXml.exists()) {
            throw new GradleException("Main web.xml not found at $mainWebXml")
        }
        if (!webXmlFragmentFile.exists()) {
            logger.lifecycle("No JSPC fragment found at $webXmlFragmentFile — copying main web.xml unchanged.")
            mergedWebXmlFile.parentFile.mkdirs()
            mergedWebXmlFile.text = mainWebXml.getText('UTF-8')
            return
        }

        // Secure XML parser (no external entities)
        def parser = new XmlParser(false, false)
        parser.setFeature("http://apache.org/xml/features/disallow-doctype-decl", true)
        parser.setFeature("http://xml.org/sax/features/external-general-entities", false)
        parser.setFeature("http://xml.org/sax/features/external-parameter-entities", false)

        Node mainRoot = parser.parse(mainWebXml)
        Node fragRoot = parser.parse(webXmlFragmentFile)

        // Collect existing servlet names and mappings
        Set<String> existingServletNames = (mainRoot.'servlet'*. 'servlet-name'*.text()).flatten() as Set

        Map<String, Set<String>> existingMappings = [:].withDefault { new LinkedHashSet<String>() }
        mainRoot.'servlet-mapping'.each { Node m ->
            def name = m.'servlet-name'.text()
            m.'url-pattern'.each { Node p -> existingMappings[name] << p.text() }
        }

        // --- Merge <servlet> entries (skip by servlet-name) ---
        fragRoot.'servlet'.each { Node s ->
            def name = s.'servlet-name'.text()
            if (!existingServletNames.contains(name)) {
                mainRoot.append(s.clone())
                existingServletNames << name
            }
        }

        // --- Merge <servlet-mapping> entries (de-dupe per pattern) ---
        fragRoot.'servlet-mapping'.each { Node m ->
            def name = m.'servlet-name'.text()
            def patterns = m.'url-pattern'*.text()

            // Find which patterns are new for that servlet-name
            def missing = patterns.findAll { !(it in existingMappings[name]) }
            if (!missing.isEmpty()) {
                def newMap = new Node(null, 'servlet-mapping')
                new Node(newMap, 'servlet-name', name)
                missing.each { p -> new Node(newMap, 'url-pattern', p) }
                mainRoot.append(newMap)
                existingMappings[name].addAll(missing)
            }
        }

        // Write pretty output
        mergedWebXmlFile.parentFile.mkdirs()
        def writer = new StringWriter()
        def printer = new XmlNodePrinter(new PrintWriter(writer))
        printer.preserveWhitespace = true
        printer.print(mainRoot)
        mergedWebXmlFile.text = writer.toString()
        logger.lifecycle("Merged web.xml written to $mergedWebXmlFile")
    }
}
